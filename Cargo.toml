[package]
name = "whatsapp-bot"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
description = "WhatsApp bot with commands, a dashboard, and a durable outbox"
license = "MIT"

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
libsqlite3-sys = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
mongodb = "3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-i18n = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "postgres", "any"] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
whatsapp-rust = { version = "=0.7.0", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native", "signal"] }

[profile.release]
lto = "thin"
strip = true

